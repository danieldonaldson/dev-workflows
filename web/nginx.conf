# Static-site nginx for nginx-unprivileged (uid 101, :8080) behind a TLS-terminating edge.
# Origin: toutouwai apps/dashboard/nginx.conf. Guarded by nginx-headers.spec.ts.
#
# THE RULE: add_header inheritance is REPLACE, not merge. A location declaring any add_header
# drops every server-level one, silently. So every add_header lives at server level and
# per-path caching goes through this map. An empty value emits no header.
map $uri $cache_control {
    default                       "";
    "~^/_astro/"                  "public, immutable, max-age=31536000";
    "~*\.(?:woff2?|eot|ttf|otf)$" "public, immutable, max-age=31536000";
    "~*\.html$"                   "no-cache, no-store, must-revalidate";
    "~^/config\.js$"              "no-store";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Relative redirects, so try_files' trailing-slash redirect never leaks :8080 publicly.
    absolute_redirect off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Pin inline scripts by sha256 (regenerate from built HTML on framework upgrades; test it).
    # Every third-party origin needs a comment saying WHICH feature breaks without it — and a
    # test pinning it, because a too-tight CSP fails silently in production:
    #   challenges.cloudflare.com       Turnstile (script-src + frame-src)
    #   static.cloudflareinsights.com   CF Web Analytics beacon — HOST form; the documented
    #                                   .../beacon.min.js path form does NOT match (versioned subpath)
    #   payment vendor                  inline checkout needs frame-src + script-src + connect-src
    # Cloudflare "JavaScript Detections" injects an inline script whose hash changes per request:
    # disable it for this host or move to nonces. Never 'unsafe-inline' in script-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src https://challenges.cloudflare.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Cache-Control $cache_control always;   # keep LAST; no add_header below this line

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Probe target. `/` on an SPA says nothing about health (it may be a redirect stub).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Runtime public config rendered from env into /tmp at startup (read-only root FS).
    location = /config.js {
        root /tmp;
        default_type application/javascript;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
